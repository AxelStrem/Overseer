[package]
name = "overseer"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A minimalistic personal data management framework"
authors = ["Dmitrii XL <axelstrem@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AxelStrem/Overseer"

[lib]
name = "overseer"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Parser dependencies (we'll use nom for parsing)
nom = "7.1"

# Regular expressions for dependency extraction
regex = "1.10"

# File watching
notify = "6.0"

# Hashing for source fingerprinting
twox-hash = "1.6"

[dev-dependencies]
parking_lot = "0.12"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Debug logging features
debug-parser = []
debug-resolver = []
debug-evaluator = []
debug-deps = []

# The backend does heavy tree work on every interaction, and an unoptimized build makes that
# take seconds rather than milliseconds - `tauri dev` is unusable for editing documents
# without this. Optimizing dependencies fully costs nothing after the first build, since they
# rarely change; opt-level 1 on our own code keeps incremental rebuilds quick while removing
# most of the penalty.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
