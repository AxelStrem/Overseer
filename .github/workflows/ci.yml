name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Round-trip tests compare a saved document with its source byte for byte, so every
      # system checks out the bytes the repository holds, not ones converted to CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.152

      - run: npm ci

      # Each test in a process of its own, so the ones that need the process alone run side by side.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo nextest run --features server --no-fail-fast

      - name: Page tests
        run: npx vitest run -c tests/vitest.config.mjs

  # The desktop app is behind a feature the tests do not turn on, so they can pass while it no
  # longer builds. Windows is left out: its build needs the fixed WebView2 runtime, which is not
  # in the repository (see DEVELOPMENT.md).
  desktop:
    name: Desktop app builds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the webview's system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app embeds the built page, and will not compile without it.
      - run: npm ci
      - run: npm run build

      - name: Check the desktop app
        working-directory: src-tauri
        run: cargo check --features desktop
