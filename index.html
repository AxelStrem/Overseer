<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseer</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app" class="shell">
        <!-- The shell of the drawer; what it shows is whoever is looking's drawer document - see drawer.js. -->
        <nav id="drawer" class="drawer" aria-label="Drawer">
            <div class="drawer-head">
                <span class="drawer-title">Overseer</span>
                <button id="drawer-fold" class="drawer-fold" title="Hide the menu (Ctrl+\)" aria-label="Hide the menu">&laquo;</button>
            </div>

            <div id="drawer-document" class="drawer-document" hidden></div>
            <a id="drawer-sign-in" class="drawer-action" hidden>Sign in</a>

            <div id="status-bar" class="drawer-foot">
                <span id="status-message">Ready</span>
                <span id="status-info"></span>
            </div>
        </nav>
        <div id="drawer-backdrop" class="drawer-backdrop"></div>

        <main id="main">
            <div id="main-bar">
                <button id="drawer-open" class="drawer-open" title="Show the menu (Ctrl+\)" aria-label="Show the menu">&#9776;</button>
                <div id="tab-container"></div>
            </div>

            <div id="content-area">
                <!-- No screen is shown until the page knows which: a document's address is loading it. -->
                <div id="loading-screen" class="screen" aria-busy="true">
                    <div id="loading-display" class="page-display"></div>
                </div>

                <div id="welcome-screen" class="screen">
                    <h2>Overseer</h2>
                    <p>A minimalistic personal data management framework</p>
                    <div class="welcome-actions desktop-only">
                        <button class="primary" id="welcome-open-btn">Open Existing File</button>
                        <button class="secondary" id="welcome-new-btn">Create New File</button>
                    </div>
                    <div id="document-list" class="document-list" hidden></div>
                </div>

                <div id="editor-screen" class="screen">
                    <div id="content-display"></div>
                </div>

                <div id="error-screen" class="screen">
                    <div id="error-display" class="page-display"></div>
                    <p id="error-message"></p>
                    <button id="error-back-btn">Back</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
