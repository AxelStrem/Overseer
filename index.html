<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseer</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app" class="shell">
        <!-- The documents kept to hand, and what there is to do with the open one - see drawer.js. -->
        <nav id="drawer" class="drawer" aria-label="Documents">
            <div class="drawer-head">
                <span class="drawer-title">Overseer</span>
                <button id="drawer-fold" class="drawer-fold" title="Hide the menu (Ctrl+\)" aria-label="Hide the menu">&laquo;</button>
            </div>

            <section class="drawer-section">
                <div class="drawer-heading">Documents</div>
                <ul id="drawer-places" class="drawer-places"></ul>
                <button id="drawer-keep" class="drawer-action" hidden>+ Keep this document here</button>
                <button id="drawer-edit-list" class="drawer-action quiet">Edit this list</button>
            </section>

            <section class="drawer-section">
                <div class="drawer-heading">This document</div>
                <div id="file-path" class="drawer-path"></div>
                <button id="undo-file-btn" class="drawer-action" title="Take back the last change (Ctrl+Z)" disabled>Undo</button>
                <button id="open-file-btn" class="drawer-action desktop-only">Open a file&hellip;</button>
                <button id="new-file-btn" class="drawer-action desktop-only">New file&hellip;</button>
            </section>

            <div id="status-bar" class="drawer-foot">
                <span id="status-message">Ready</span>
                <span id="status-info"></span>
            </div>
        </nav>
        <div id="drawer-backdrop" class="drawer-backdrop"></div>

        <main id="main">
            <div id="main-bar">
                <button id="drawer-open" class="drawer-open" title="Show the menu (Ctrl+\)" aria-label="Show the menu">&#9776;</button>
                <div id="tab-container"></div>
            </div>

            <div id="content-area">
                <div id="welcome-screen" class="screen active">
                    <h2>Welcome to Overseer</h2>
                    <p>A minimalistic personal data management framework</p>
                    <div class="welcome-actions desktop-only">
                        <button class="primary" id="welcome-open-btn">Open Existing File</button>
                        <button class="secondary" id="welcome-new-btn">Create New File</button>
                    </div>
                </div>

                <div id="editor-screen" class="screen">
                    <div id="content-display"></div>
                </div>

                <div id="error-screen" class="screen">
                    <h2>Error</h2>
                    <p id="error-message"></p>
                    <button id="error-back-btn">Back</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
